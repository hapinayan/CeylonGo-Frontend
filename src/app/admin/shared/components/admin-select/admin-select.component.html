<div
  class="admin-select-container"
  [class.is-open]="isOpen()"
  [class.is-disabled]="disabled"
  [style.min-width]="minWidth"
  [style.max-width]="maxWidth"
>
  <!-- Trigger Button -->
  <button
    type="button"
    class="select-trigger"
    [id]="id + '-trigger'"
    [attr.aria-label]="ariaLabel"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-controls]="id + '-listbox'"
    [disabled]="disabled"
    (click)="toggleDropdown()"
    (keydown)="onTriggerKeyDown($event)"
  >
    <div class="trigger-content">
      <!-- Leading Icon -->
      <span *ngIf="leadingIcon" class="leading-icon" [ngSwitch]="leadingIcon" aria-hidden="true">
        <!-- Map Icon (Province) -->
        <svg *ngSwitchCase="'map'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>

        <!-- Location Pin Icon (District) -->
        <svg *ngSwitchCase="'location'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>

        <!-- Clipboard Icon (Listing Approval Status) -->
        <svg *ngSwitchCase="'clipboard'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          <path d="M9 12l2 2 4-4"></path>
        </svg>

        <!-- Shield Check Icon (Property Verification) -->
        <svg *ngSwitchCase="'shield'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>

        <!-- Category Grid Icon -->
        <svg *ngSwitchCase="'category'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>

        <!-- Status Circle Icon -->
        <svg *ngSwitchCase="'status'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 14 14"></polyline>
        </svg>

        <!-- Page Size Icon -->
        <svg *ngSwitchCase="'page'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </span>

      <!-- Status Dot if selected option has status -->
      <span
        *ngIf="selectedOption() && getBadgeColorClass(selectedOption()!)"
        class="status-indicator-dot"
        [ngClass]="getBadgeColorClass(selectedOption()!)"
        aria-hidden="true"
      ></span>

      <!-- Label Display -->
      <span class="trigger-label" [class.is-placeholder]="!selectedOption() && !disabledHint">
        {{ displayLabel() }}
      </span>
    </div>

    <!-- Trailing Chevron Icon -->
    <span class="chevron-icon" [class.is-rotated]="isOpen()" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </button>

  <!-- Dropdown Options Panel -->
  <div
    *ngIf="isOpen()"
    class="select-options-panel"
    [id]="id + '-listbox'"
    role="listbox"
    [attr.aria-label]="ariaLabel"
  >
    @for (option of options; track option.key; let i = $index) {
      <div
        class="select-option"
        [class.is-selected]="option.key === value"
        [class.is-focused]="i === focusedIndex()"
        [class.is-disabled]="option.disabled"
        [attr.data-option-index]="i"
        role="option"
        [attr.aria-selected]="option.key === value"
        [attr.aria-disabled]="option.disabled"
        (click)="selectOption(option)"
      >
        <div class="option-content">
          <!-- Status Indicator Dot -->
          <span
            *ngIf="getBadgeColorClass(option)"
            class="status-indicator-dot"
            [ngClass]="getBadgeColorClass(option)"
            aria-hidden="true"
          ></span>

          <!-- Option Label and Sublabel -->
          <span class="option-label-group">
            <span class="option-label">{{ option.label }}</span>
            <span *ngIf="option.sublabel" class="option-sublabel">{{ option.sublabel }}</span>
          </span>
        </div>

        <!-- Selected Checkmark -->
        <span *ngIf="option.key === value" class="selected-checkmark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
      </div>
    }
  </div>
</div>
