<div class="status-page" (click)="onBackdropClick($event)">
  <div class="status-card" role="dialog" aria-modal="true" aria-labelledby="check-email-title">

    <!-- CLOSE BUTTON -->
    <button
      type="button"
      class="close-btn"
      aria-label="Close modal"
      (click)="closeModal()"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- CEYLONGO LOGO -->
    <div class="modal-logo-wrapper">
      <img
        src="/images/ceylongo-brand-logo.png"
        alt="CeylonGo - Discover Local. Feel at Home."
        class="modal-logo"
      />
    </div>

    <!-- EMAIL ICON IN LIGHT ORANGE CIRCULAR BACKGROUND -->
    <div class="status-icon-wrapper" aria-hidden="true">
      <div class="status-icon">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m2 6 10 7 10-7" />
        </svg>
      </div>
    </div>

    <!-- HEADING & DESCRIPTION -->
    <div class="modal-header">
      <h1 id="check-email-title">Check Your Email</h1>
      <p class="subtitle">
        If an account exists for this email address, we've sent a password reset link.
      </p>
    </div>

    <!-- EMAIL DISPLAY CONTAINER -->
    @if (email) {
      <div class="email-display-box">
        <span class="email-value">{{ email }}</span>
      </div>
    }

    <!-- ADDITIONAL INSTRUCTIONS -->
    <p class="instruction-text">
      Please check your inbox and spam folder. Open the link in the email to reset your password.
    </p>

    <!-- ACTION BUTTONS -->
    <div class="actions-group">
      <!-- PRIMARY BUTTON: OPEN EMAIL APP -->
      <a
        href="mailto:"
        class="primary-btn"
        (click)="openEmailApp()"
      >
        Open Email App
      </a>

      <!-- SECONDARY NAVIGATION: BACK TO SIGN IN -->
      <div class="bottom-nav">
        <button
          type="button"
          class="back-link"
          (click)="backToLogin()"
        >
          &larr; Back to Sign In
        </button>
      </div>
    </div>

  </div>
</div>
