<aside id="ai-trip-planner" class="ai-banner-card" aria-labelledby="ai-banner-title">
  <div class="banner-content">
    <div class="banner-badge" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 7.2L21 12l-6.6 2.8L12 22l-2.4-7.2L3 12l6.6-2.8z"></path>
      </svg>
    </div>

    <h2 id="ai-banner-title" class="banner-title">Plan Your Trip with AI</h2>

    <p class="banner-description">
      Get a personalized Sri Lanka itinerary based on your interests, dates and budget.
    </p>

    <button
      type="button"
      class="btn-try-ai"
      (click)="onTryPlanner($event)"
      aria-label="Try AI Trip Planner"
    >
      <span>Try AI Trip Planner</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>

  <div class="banner-image-wrap">
    <img
      src="/images/banners/ai-trip-planner.webp"
      alt="AI Trip Planner preview with personalized Sri Lanka itinerary"
      class="banner-laptop-img"
      loading="lazy"
    />
  </div>
</aside>
