<article class="experience-card" [attr.aria-label]="experience.name">
  <!-- IMAGE CONTAINER WITH FLOATING WISHLIST BUTTON -->
  <div class="card-image-wrap">
    <img
      [src]="experience.image"
      [alt]="experience.name + ' in ' + experience.location"
      class="experience-image"
      loading="lazy"
    />

    <!-- WISHLIST HEART BUTTON -->
    <button
      type="button"
      class="btn-wishlist"
      (click)="toggleWishlist($event)"
      (keydown.enter)="toggleWishlist($event)"
      (keydown.space)="toggleWishlist($event)"
      [class.active]="isWishlisted()"
      [attr.aria-label]="isWishlisted() ? 'Remove ' + experience.name + ' from wishlist' : 'Add ' + experience.name + ' to wishlist'"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        [attr.fill]="isWishlisted() ? '#FF385C' : 'rgba(0, 0, 0, 0.35)'"
        [attr.stroke]="isWishlisted() ? '#FF385C' : '#FFFFFF'"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </button>
  </div>

  <!-- CONTENT INFO PANEL -->
  <div class="card-content">
    <h3 class="experience-name">{{ experience.name }}</h3>

    <div class="experience-location">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
      <span>{{ experience.location }}</span>
    </div>

    <div class="card-footer-row">
      <!-- RATING & REVIEWS -->
      <div class="experience-rating" [attr.aria-label]="'Rating: ' + experience.rating + ' stars from ' + experience.reviewCount + ' reviews'">
        <svg class="star-icon" width="15" height="15" viewBox="0 0 24 24" fill="#F59E0B" stroke="#F59E0B" stroke-width="1" aria-hidden="true">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span class="rating-val">{{ experience.rating | number:'1.1-1' }}</span>
        <span class="review-count">({{ experience.reviewCount }})</span>
      </div>
    </div>
  </div>
</article>
