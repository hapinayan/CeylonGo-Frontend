<article
  class="category-card"
  [attr.aria-label]="category().title + ' - ' + category().description"
>
  <div class="category-image-wrap">
    <img
      [src]="category().image"
      [alt]="category().title + ' in Sri Lanka'"
      class="category-image"
      loading="lazy"
    />
  </div>

  <div class="category-info-panel">
    <div class="category-text-block">
      <div class="category-title-row">
        <span class="category-icon" [attr.data-icon]="category().icon" aria-hidden="true">
          @switch (category().icon) {
            @case ('homestays') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 7h-8v8H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4zm-8 6H5v-4h6v4z"/>
              </svg>
            }
            @case ('activities') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/>
              </svg>
            }
            @case ('nature') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5c1-1 3.5-1 5-1s4.5 1.5 6 1.5 3-1 4-2z"/>
              </svg>
            }
          }
        </span>
        <h3 class="category-title">{{ category().title }}</h3>
      </div>

      <p class="category-desc">{{ category().description }}</p>
    </div>

    <button
      type="button"
      class="category-arrow-btn"
      [attr.aria-label]="'Explore ' + category().title"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>
</article>
