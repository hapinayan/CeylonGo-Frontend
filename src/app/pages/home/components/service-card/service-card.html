<div
  class="service-card"
  tabindex="0"
  role="region"
  [attr.aria-label]="service().name"
>
  <div class="service-icon-wrap" aria-hidden="true">
    @switch (service().icon) {
      @case ('homestays') {
        <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 7h-8v8H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4zm-8 6H5v-4h6v4z"/>
        </svg>
      }
      @case ('experiences') {
        <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/>
        </svg>
      }
      @case ('tour-guide') {
        <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="9" cy="8" r="3.5"/>
          <path d="M9 13c-3.31 0-6 2.69-6 6v2h12v-2c0-3.31-2.69-6-6-6z"/>
          <path d="M17 2v19h2v-8h4l-2-3 2-3h-4V2h-2z"/>
        </svg>
      }
      @case ('bike-rental') {
        <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5zm14-8.5c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5zm-3.2-9l-2.62-4.4c-.36-.59-.98-.96-1.68-.96H8.5v2h2.5l1.6 2.7-3.8 6.4 1.7 1 3.5-5.9 2.5 4.2h3.5v-2h-2.3l-1.5-3.1z"/>
        </svg>
      }
      @case ('community') {
        <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
      }
      @case ('ai-planner') {
        <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a1 1 0 0 1 1 1v1.07A7.002 7.002 0 0 1 19 11v4a7 7 0 0 1-5 6.71V22a1 1 0 1 1-2 0v-.29A7 7 0 0 1 5 15v-4a7.002 7.002 0 0 1 6-6.93V3a1 1 0 0 1 1-1zm-4 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-6.5 5a.75.75 0 0 0 0 1.5c1.47 1.05 3.53 1.05 5 0a.75.75 0 1 0-.9-1.2 2.76 2.76 0 0 1-3.2 0 .75.75 0 0 0-.9 0z"/>
          <circle cx="2" cy="12" r="1.5"/>
          <circle cx="22" cy="12" r="1.5"/>
        </svg>
      }
    }
  </div>

  <h3 class="service-title">{{ service().name }}</h3>
</div>
