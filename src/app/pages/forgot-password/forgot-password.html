<div class="forgot-page" (click)="onBackdropClick($event)">
  <div class="forgot-modal" role="dialog" aria-modal="true" aria-labelledby="forgot-modal-title">

    <!-- CLOSE BUTTON -->
    <button
      type="button"
      class="close-btn"
      aria-label="Close modal"
      (click)="closeModal()"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- CEYLONGO LOGO -->
    <div class="modal-logo-wrapper">
      <img
        src="/images/ceylongo-brand-logo.png"
        alt="CeylonGo - Discover Local. Feel at Home."
        class="modal-logo"
      />
    </div>

    <!-- HEADING & DESCRIPTION -->
    <div class="modal-header">
      <h1 id="forgot-modal-title">Forgot Password?</h1>
      <p class="subtitle">
        Enter your registered email address and we'll send you a link to reset your password.
      </p>
    </div>

    <!-- SERVER ERROR MESSAGE -->
    @if (errorMessage) {
      <div class="alert-box error-box" role="alert">
        <p>{{ errorMessage }}</p>
      </div>
    }

    <!-- FORGOT FORM -->
    <form
      [formGroup]="forgotForm"
      (ngSubmit)="sendResetLink()"
      novalidate
      class="forgot-form"
    >
      <!-- EMAIL INPUT -->
      <div class="form-group">
        <label for="forgot-email" class="field-label">Email Address</label>
        <div
          class="input-wrapper"
          [class.input-error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
        >
          <!-- EMAIL ICON -->
          <svg
            class="field-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m2 6 10 7 10-7" />
          </svg>

          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            placeholder="Enter your email address"
            aria-label="Email address"
            autocomplete="email"
            maxlength="254"
          />
        </div>

        @if (forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid) {
          <small class="error-text">
            Please enter a valid email address.
          </small>
        }
      </div>

      <!-- PRIMARY BUTTON -->
      <button
        type="submit"
        class="reset-btn"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>Sending link...</span>
        } @else {
          <span>Send Reset Link &rarr;</span>
        }
      </button>
    </form>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
      <button
        type="button"
        class="back-link"
        (click)="goBack()"
      >
        &larr; Back to Sign In
      </button>
    </div>

  </div>
</div>
