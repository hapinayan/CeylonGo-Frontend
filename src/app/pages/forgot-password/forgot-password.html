<!-- TRAVELER HOMEPAGE UNDERLAY (BLURRED IN BACKGROUND) -->
<div class="homepage-underlay" aria-hidden="true" tabindex="-1">
  <app-traveler-home></app-traveler-home>
</div>

<!-- AUTH MODAL BACKDROP (DARK OVERLAY & BLUR) -->
<div class="auth-modal-backdrop forgot-page" (click)="onBackdropClick($event)">
  <div class="auth-modal-card forgot-modal" role="dialog" aria-modal="true" aria-labelledby="forgot-modal-title">

    <!-- CLOSE (X) BUTTON IN TOP-RIGHT -->
    <button
      type="button"
      class="modal-close-btn close-btn"
      aria-label="Close modal"
      (click)="closeModal()"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- CEYLONGO BRAND LOGO -->
    <div class="modal-logo-wrapper">
      <img
        src="/images/ceylongo-brand-logo.png"
        alt="CeylonGo - Discover Local. Feel at Home."
        class="modal-logo-img modal-logo"
      />
    </div>

    <!-- HEADING & DESCRIPTION -->
    <div class="modal-header">
      <h1 id="forgot-modal-title" class="modal-title">Forgot Password?</h1>
      <p class="modal-subtitle subtitle">
        Enter your registered email address and we'll send you a link to reset your password.
      </p>
    </div>

    <!-- SERVER ERROR MESSAGE -->
    @if (errorMessage) {
      <div class="modal-alert-error alert-box error-box" role="alert">
        <svg class="alert-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p>{{ errorMessage }}</p>
      </div>
    }

    <!-- FORGOT FORM -->
    <form
      [formGroup]="forgotForm"
      (ngSubmit)="sendResetLink()"
      novalidate
      class="recovery-form forgot-form"
    >
      <!-- EMAIL INPUT -->
      <div class="field-wrapper form-group">
        <label for="forgot-email" class="field-label">Email Address</label>
        <div
          class="input-group input-wrapper"
          [class.has-error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
          [class.input-error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
        >
          <!-- EMAIL ICON -->
          <div class="input-icon-wrapper" aria-hidden="true">
            <svg
              class="field-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m2 6 10 7 10-7" />
            </svg>
          </div>

          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            placeholder="Enter your email address"
            aria-label="Email address"
            autocomplete="email"
            maxlength="254"
            class="auth-text-input"
          />
        </div>

        @if (forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid) {
          <small class="inline-field-error error-text">
            Please enter a valid email address.
          </small>
        }
      </div>

      <!-- PRIMARY BUTTON (SOLID BLUE #2563EB) -->
      <button
        type="submit"
        class="btn-primary-blue reset-btn"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>Sending link...</span>
        } @else {
          <span>Send Reset Link &rarr;</span>
        }
      </button>
    </form>

    <!-- BOTTOM NAVIGATION (BACK TO SIGN IN) -->
    <div class="auth-bottom-switch bottom-nav">
      Remember your password?
      <button
        type="button"
        class="switch-auth-link back-link"
        (click)="goBack()"
      >
        Back to Sign In
      </button>
    </div>

  </div>
</div>
