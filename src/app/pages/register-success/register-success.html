<div class="success-page" (click)="onBackdropClick($event)">
  <div class="success-card" role="dialog" aria-modal="true" aria-labelledby="register-success-title">

    <!-- CLOSE BUTTON -->
    <button
      type="button"
      class="close-btn"
      aria-label="Close modal"
      (click)="closeModal()"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- CEYLONGO LOGO -->
    <div class="modal-logo-wrapper">
      <img
        src="/images/ceylongo-brand-logo.png"
        alt="CeylonGo - Discover Local. Feel at Home."
        class="modal-logo"
      />
    </div>

    <!-- SUCCESS CHECKMARK ICON (LIGHT GREEN CIRCLE) -->
    <div class="success-icon-wrapper" aria-hidden="true">
      <div class="success-icon">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>

    <!-- HEADING & SUPPORTING TEXT -->
    <div class="modal-header">
      <h1 id="register-success-title">Account Created Successfully!</h1>
      <p class="subtitle">Welcome to CeylonGo! Your account is ready.</p>
    </div>

    <!-- PERSONALIZED GREETING -->
    @if (firstName) {
      <p class="personalized-greeting">
        Hello, {{ firstName }}!
      </p>
    }

    <!-- REGISTERED EMAIL DISPLAY BOX -->
    @if (email) {
      <div class="email-display-box">
        <span class="email-value">{{ email }}</span>
      </div>
    }

    <!-- ADDITIONAL MESSAGE -->
    <p class="journey-text">
      Sign in to start exploring Sri Lanka with CeylonGo.
    </p>

    <!-- ACTIONS GROUP -->
    <div class="actions-group">
      <!-- PRIMARY BUTTON -->
      <button
        type="button"
        class="primary-btn"
        (click)="goToLogin()"
      >
        Continue to Login &rarr;
      </button>

      <!-- SECONDARY NAVIGATION -->
      <div class="bottom-nav">
        <button
          type="button"
          class="back-link"
          (click)="goToAuth()"
        >
          Back to Sign In / Register
        </button>
      </div>
    </div>

  </div>
</div>
