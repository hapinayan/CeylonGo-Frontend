<article class="artisan-card" [class.list-layout]="layout === 'list'" [routerLink]="['/artisans', listing.id]" [queryParams]="queryParams()">
  <!-- CARD IMAGE CONTAINER -->
  <div class="card-image-box">
    <img
      [src]="displayImage()"
      [alt]="listing.title + ' craft workshop'"
      (error)="onImageError($event)"
      loading="lazy"
      class="card-img"
    />

    <!-- WISHLIST HEART BUTTON -->
    <button
      type="button"
      class="wishlist-btn"
      [class.active]="isSaved()"
      (click)="toggleWishlist($event)"
      [attr.aria-label]="isSaved() ? 'Remove from favorites' : 'Save to favorites'"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isSaved() ? '#1255B5' : 'none'" [attr.stroke]="isSaved() ? '#1255B5' : '#1E293B'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
      </svg>
    </button>
  </div>

  <!-- CARD BODY -->
  <div class="card-body">
    <!-- TITLE & VERIFIED BADGE -->
    <div class="title-row">
      <h3 class="card-title">{{ listing.title }}</h3>
      @if (listing.is_verified) {
        <app-verified-badge [size]="16" />
      }
    </div>

    <!-- LOCATION -->
    <div class="location-row">
      <svg class="pin-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
      <span class="location-text">{{ listing.city || listing.district }}</span>
    </div>

    <!-- RATING & CATEGORY BADGE ROW -->
    <div class="footer-row">
      <app-rating-stars
        [rating]="listing.average_rating"
        [reviewCount]="listing.total_reviews"
      />
      <span class="category-badge">{{ listing.craft_category }}</span>
    </div>
  </div>
</article>
