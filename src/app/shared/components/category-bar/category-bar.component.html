<div class="category-cards-scroll" role="tablist" aria-label="Artisan and craft categories">
  @for (cat of categories; track cat.id) {
    <button
      type="button"
      class="category-icon-card"
      [class.selected]="isSelected(cat)"
      (click)="select(cat)"
      role="tab"
      [attr.aria-selected]="isSelected(cat)"
    >
      <div class="category-icon-box" aria-hidden="true">
        @switch (cat.icon) {
          @case ('all') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
          }
          @case ('handicrafts') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L14.8 8.5L21.5 9.3L16.5 14L17.9 20.7L12 17.3L6.1 20.7L7.5 14L2.5 9.3L9.2 8.5L12 2Z" />
            </svg>
          }
          @case ('pottery') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3h8l-1 4c2.5 1.8 4 4.4 4 7.5C19 18.4 16 21 12 21s-7-2.6-7-6.5c0-3.1 1.5-5.7 4-7.5L8 3z" />
              <path d="M9 7h6" />
            </svg>
          }
          @case ('batik') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5c4 2 8-2 12 0l4-1v15l-4 1c-4-2-8 2-12 0V5z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          }
          @case ('weaving') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M4 12h16M4 17h16M7 4v16M12 4v16M17 4v16" />
            </svg>
          }
          @case ('jewellery') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h12l4 6-10 12L2 9l4-6z" />
              <path d="M2 9h20M12 21L8 9l4-6 4 6-4 12z" />
            </svg>
          }
          @case ('woodcarving') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2c4.5 0 7 3.2 7 8 0 5.5-3.2 10.5-7 12-3.8-1.5-7-6.5-7-12 0-4.8 2.5-8 7-8z" />
              <circle cx="9.5" cy="9.5" r="1" />
              <circle cx="14.5" cy="9.5" r="1" />
              <path d="M9 15c1 .8 2 1.2 3 1.2s2-.4 3-1.2" />
            </svg>
          }
          @case ('local') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          }
          @case ('spices') {
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5c1-1 3.5-1 5-1" />
            </svg>
          }
        }
      </div>
      <span class="category-card-label">{{ cat.label }}</span>
    </button>
  }
</div>
