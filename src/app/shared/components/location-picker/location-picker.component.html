<div class="location-picker-wrap">
  <div class="picker-map-container" #pickerMap></div>
  <div class="picker-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="16" x2="12" y2="12" />
      <line x1="12" y1="8" x2="12.01" y2="8" />
    </svg>
    <span>Click the map or drag the blue marker to pin the exact property entrance.</span>
  </div>

  <div class="coords-row">
    <div class="coord-field">
      <label class="coord-label">Latitude</label>
      <input
        type="number"
        step="0.0001"
        class="input-coord"
        [ngModel]="latInput()"
        (ngModelChange)="latInput.set($event); onManualCoordinateChange()"
      />
    </div>
    <div class="coord-field">
      <label class="coord-label">Longitude</label>
      <input
        type="number"
        step="0.0001"
        class="input-coord"
        [ngModel]="lngInput()"
        (ngModelChange)="lngInput.set($event); onManualCoordinateChange()"
      />
    </div>
  </div>
</div>
