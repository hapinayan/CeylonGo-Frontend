<aside class="account-panel" [class.dashboard]="premium()" aria-label="Traveler account">
  <div class="identity">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <div>
      <strong>{{ preview() ? 'Preview account' : account()?.full_name || 'Traveler account' }}</strong>
      @if (account()?.email; as email) { <small>{{ email }}</small> }
    </div>
  </div>
  <nav class="account-links" aria-label="Account navigation">
    <span><app-experience-icon name="user" /> <span>My Profile <small>Unavailable</small></span></span>
    <a routerLink="/my-bookings" [queryParams]="preview() ? {preview: '1'} : {}"
      [queryParamsHandling]="active() === 'bookings' ? 'preserve' : 'replace'"
      [attr.aria-current]="active() === 'bookings' ? 'location' : null"><app-experience-icon name="calendar" /> My Bookings</a>
    <a routerLink="/wishlist" [queryParams]="preview() ? {preview: '1'} : {}"
      [attr.aria-current]="active() === 'wishlist' ? 'location' : null"><app-experience-icon name="heart" /> Wishlist</a>
    <span><app-experience-icon name="bell" /> <span>Notifications <small>In the navbar</small></span></span>
    <span><app-experience-icon name="settings" /> <span>Account Settings <small>Unavailable</small></span></span>
    @if (account()) { <button type="button" (click)="signedOut.emit()"><app-experience-icon name="logout" /> Log out</button> }
  </nav>
</aside>
